[project]
name = "audio-generation"
version = "0.1.0"
description = "TTS script for generating MP3 audio from phoneme example words using Chatterbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chatterbox-tts>=0.1.0",
    "pydantic>=2.0.0",
    "tqdm>=4.0.0",
    "pydub>=0.25.0",
]

[project.scripts]
audio-gen = "audio_generation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_generation"]

[tool.uv.extra-build-dependencies]
pkuseg = ["numpy"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
