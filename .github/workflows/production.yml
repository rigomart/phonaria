name: Production

# Deploys production to the public custom domain.

on:
  workflow_dispatch:
    inputs:
      run_contract:
        description: Run the complete browser contract after deploying
        type: boolean
        required: false
        default: true
      baseline:
        description: Also record page-load and transcription baselines
        type: boolean
        required: false
        default: false

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ENV: production
      SITE_URL: https://phonaria.rigos.dev
      SITE_INDEXING_ENABLED: "1"
      FLAG_PRACTICE: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Resolve production deployment origin
        id: origin
        run: |
          url="https://phonaria.rigos.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production contract origin: $url"

      - name: Generate Cloudflare Worker types
        run: bun --cwd apps/phonaria cf-typegen

      - name: Production build
        run: bun --cwd apps/phonaria build

      - name: Assert production Worker name
        working-directory: apps/phonaria
        run: bun ./scripts/assert-generated-worker-name.ts phonaria

      - name: Assert the production custom domain
        working-directory: apps/phonaria
        run: bun ./scripts/assert-production-custom-domain.ts

      - name: Assert Practice word data stays out of the Worker
        working-directory: apps/phonaria
        run: bun ./scripts/assert-worker-excludes-curated-10k.ts

      - name: Assert server bundle keeps curated-10k client-only
        working-directory: apps/phonaria
        env:
          WORKER_BUNDLE_DIR: dist/server
        run: bun ./scripts/assert-server-bundle-boundary.ts

      - name: Capture Worker startup time
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/phonaria
        run: |
          set -o pipefail
          bunx wrangler deploy --dry-run --outdir .wrangler/dry-run | tee wrangler-dry-run.log

      - name: Write Worker secrets file
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/phonaria
        run: bun ./scripts/write-worker-secrets.ts

      - name: Deploy production Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/phonaria
          command: deploy --secrets-file .wrangler/worker-secrets.json

      - name: Warn when Turso secrets are missing
        if: env.CLOUDFLARE_API_TOKEN != '' && (env.TURSO_DATABASE_URL == '' || env.TURSO_AUTH_TOKEN == '')
        run: |
          echo "::warning::Turso secrets are not configured. Server-tier transcription will fail on the production Worker until TURSO_DATABASE_URL and TURSO_AUTH_TOKEN are set."

      - name: Record deployed Worker metrics
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/phonaria
        env:
          # Measure the Wrangler upload, not Vite's client+server dist tree.
          WORKER_BUNDLE_DIR: .wrangler/dry-run
          WORKER_METRICS_OUT: worker-metrics.json
          WRANGLER_DEPLOY_LOG: wrangler-dry-run.log
        run: bun ./scripts/record-worker-metrics.ts

      - name: Install Chromium
        if: ${{ inputs.run_contract && env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun --cwd packages/browser-contract e2e:install

      - name: Run the complete browser contract
        if: ${{ inputs.run_contract && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CI: true
          CONTRACT_TARGET: cloudflare-production
          CONTRACT_BASE_URL: ${{ steps.origin.outputs.url }}
          CONTRACT_CANONICAL_ORIGIN: https://phonaria.rigos.dev
        run: bun --cwd packages/browser-contract e2e

      - name: Record performance baselines
        if: ${{ inputs.baseline && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CI: true
          CONTRACT_TARGET: cloudflare-production
          CONTRACT_BASE_URL: ${{ steps.origin.outputs.url }}
          CONTRACT_CANONICAL_ORIGIN: https://phonaria.rigos.dev
        run: bun --cwd packages/browser-contract e2e:baseline

      - name: Report Worker CPU and invocation outcomes
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/phonaria
        run: bun ./scripts/query-worker-analytics.ts phonaria 30 | tee worker-analytics.log

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-evidence
          path: |
            apps/phonaria/worker-metrics.json
            apps/phonaria/worker-analytics.log
            packages/browser-contract/playwright-report/
            packages/browser-contract/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Skip deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not configured; nothing was deployed."
