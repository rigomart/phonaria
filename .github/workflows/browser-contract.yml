name: Browser contract

on:
  workflow_dispatch:
    inputs:
      target:
        description: Contract target profile
        required: true
        default: cloudflare-production
        type: choice
        options:
          - cloudflare-production
          - cloudflare-staging

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Install Playwright Chromium
        run: bun --cwd packages/browser-contract e2e:install
      - name: Run browser contract
        env:
          CI: true
          CONTRACT_TARGET: ${{ inputs.target }}
          CONTRACT_BASE_URL: ${{ secrets.CONTRACT_BASE_URL || secrets.LAB_CONTRACT_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bun e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-report
          path: |
            packages/browser-contract/playwright-report
            packages/browser-contract/test-results
          if-no-files-found: ignore
