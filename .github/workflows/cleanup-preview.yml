name: Cleanup preview

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: phonaria-pr-${{ github.event.pull_request.number }}
      LEGACY_WORKER_NAME: phonaria-lab-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete preview Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          delete_script() {
            local name="$1"
            local response="$RUNNER_TEMP/cloudflare-delete-$name.json"
            local status
            status="$(curl --silent --show-error \
              --output "$response" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true")"

            case "$status" in
              200|204)
                echo "Deleted $name."
                ;;
              404)
                echo "$name was already absent."
                ;;
              *)
                cat "$response"
                exit 1
                ;;
            esac
          }

          delete_script "$WORKER_NAME"
          delete_script "$LEGACY_WORKER_NAME"

      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Cloudflare credentials are not configured; preview cleanup was skipped."
