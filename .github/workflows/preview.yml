name: Preview

# Deploys each PR to its own protected Worker. cleanup-preview.yml removes it on close.
# release-please's Release PRs get no preview: they only bump the version and changelog.
# paths-ignore keeps them from starting a run; the job's branch check catches any that still do.

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ENV: preview
      SITE_INDEXING_ENABLED: "0"
      FLAG_PRACTICE: "1"
      FLAG_LANGUAGE_HISTORY: "1"
      FLAG_ABOUT: "1"
      FLAG_SPEECH: "1"
      FLAG_SOUND_SEARCH: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Resolve preview origin
        id: origin
        env:
          SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
        run: |
          name="phonaria-pr-${{ github.event.pull_request.number }}"
          url="$(bun apps/phonaria/scripts/resolve-preview-origin.ts "$name" "$SUBDOMAIN")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Preview origin: $url"

      - name: Generate Cloudflare Worker types
        run: bun --cwd apps/phonaria cf-typegen

      - name: Production build
        run: bun --cwd apps/phonaria build

      - name: Assert preview Worker name
        working-directory: apps/phonaria
        run: bun ./scripts/assert-generated-worker-name.ts phonaria-preview

      - name: Assert server bundle keeps curated-10k client-only
        working-directory: apps/phonaria
        env:
          WORKER_BUNDLE_DIR: dist/server
        run: bun ./scripts/assert-server-bundle-boundary.ts

      - name: Wrangler dry-run
        working-directory: apps/phonaria
        run: |
          set -o pipefail
          bunx wrangler deploy --dry-run --outdir .wrangler/dry-run | tee wrangler-dry-run.log

      - name: Record Worker metrics
        working-directory: apps/phonaria
        env:
          WRANGLER_DEPLOY_LOG: wrangler-dry-run.log
          WORKER_BUNDLE_DIR: .wrangler/dry-run
          WORKER_METRICS_OUT: worker-metrics.json
        run: bun ./scripts/record-worker-metrics.ts

      - name: Write Worker secrets file
        working-directory: apps/phonaria
        run: bun ./scripts/write-worker-secrets.ts

      - name: Start GitHub deployment
        id: deployment
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_REF: ${{ github.head_ref }}
        run: |
          id="$(bun apps/phonaria/scripts/github-deployment.ts start preview --transient)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/phonaria
          command: deploy --name ${{ steps.origin.outputs.name }} --var SITE_URL:${{ steps.origin.outputs.url }} --secrets-file .wrangler/worker-secrets.json

      - name: Run preview smoke checks and Wiktionary definition check
        env:
          CI: true
          CONTRACT_TARGET: cloudflare-staging
          CONTRACT_BASE_URL: ${{ steps.origin.outputs.url }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "${CF_ACCESS_CLIENT_ID}" ] || [ -z "${CF_ACCESS_CLIENT_SECRET}" ]; then
            echo "CF_ACCESS credentials are required to smoke preview definitions through Cloudflare Access."
            exit 1
          fi
          bun --cwd packages/browser-contract e2e:install
          bun --cwd packages/browser-contract e2e:smoke
          bun --cwd packages/browser-contract e2e:definitions

      - name: Upload Worker metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-worker-metrics
          path: |
            apps/phonaria/worker-metrics.json
            apps/phonaria/wrangler-dry-run.log
          if-no-files-found: ignore

      - name: Finish GitHub deployment
        if: always() && steps.deployment.outputs.id != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun apps/phonaria/scripts/github-deployment.ts finish "${{ steps.deployment.outputs.id }}" "${{ job.status }}" "${{ steps.origin.outputs.url }}"
