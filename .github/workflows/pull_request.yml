name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.3.6
      - name: Lint
        run: biome ci .
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Type check
        run: bun run check-types
      - name: Test
        run: bun run test
      - name: Production build
        run: bun --cwd apps/phonaria build
        env:
          CLOUDFLARE_ENV: production
          SITE_URL: https://phonaria.rigos.dev
          SITE_INDEXING_ENABLED: "1"
          FLAG_PRACTICE: "0"
          FLAG_SPELLING_CONTEXT: "0"
          TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
          TURSO_AUTH_TOKEN: ci-placeholder
